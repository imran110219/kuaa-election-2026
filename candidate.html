      "title": "নির্বাচনী ইশতেহার",
      "greeting": "একসাথে এগিয়ে চলি, ঐক্যের শক্তিতে গড়ি, সহমর্মিতার পাশে থাকি।",
      "candidateIntro": "জি এম মাসুম বিল্লাহ — সমাজ কল্যাণ সম্পাদক পদপ্রার্থী।",
      "introduction": [
        "শিক্ষার্থী এবং অ্যালামনাইদের মধ্যে সমাজসেবামূলক কাজ করতে চাই। তাই নির্বাচনে জয়-পরাজয় যাই হোক, ইশতেহারের পরিকল্পনাগুলো বাস্তবায়নে কুয়া এবং সমাজকল্যাণ সম্পাদকের পাশে থেকে সর্বাত্মক সহযোগিতা ও পাশে থাকার প্রতিশ্রুতি ব্যক্ত করছি।"
      ],
      "proposals": [
        "অসচ্ছল শিক্ষার্থীদের আর্থিক সহায়তা — অ্যালামনাইদের অনুদানে স্থায়ী তহবিল গঠন করে প্রতি বছর কমপক্ষে ২০ জন শিক্ষার্থীকে বৃত্তি প্রদান করা।",
        "অ্যালামনাই সম্মাননা ও স্বীকৃতি — শিক্ষার্থীদের মধ্যে একাডেমিক সাফল্য ও উদ্ভাবনী কাজে অবদানের জন্য, শিক্ষকদের গবেষণায়, উদ্যোগে ও দেশ-বিদেশে বিশেষ অবদানের স্বীকৃতিস্বরূপ মোট ২০ জন শিক্ষার্থী বা অ্যালামনাইকে সম্মাননা প্রদান করা।",
        "আবাসন সুবিধা ও ক্লাব প্রতিষ্ঠা — শিক্ষার্থীদের সুবিধা ও অ্যালামনাইদের নেটওয়ার্কিং নিশ্চিত করতে ঢাকা ও খুলনায় সাময়িক আবাসন এবং ‘বিশ্ববিদ্যালয় ক্লাব’ প্রতিষ্ঠা করা।",

        "ডাটাবেজ আধুনিকায়ন ও সাপোর্ট টিম — অ্যালামনাইদের কর্মক্ষেত্রের তথ্য প্রতি ৬ মাস অন্তর ওয়েবসাইটে হালনাগাদ করা এবং সরাসরি সেবার জন্য একটি কার্যকর ‘সাপোর্ট টিম’ গঠন করা।",

  <script>
    const root=document.querySelector("#content");

    const id=new URLSearchParams(location.search).get("id")||fallback.find(person=>person.manifesto)?.studentId;
    const element=(tag,className,value)=>{const node=document.createElement(tag);if(className)node.className=className;node.textContent=value;return node;};
    function render(person){
      root.replaceChildren();
      const back=document.createElement("a");back.className="back-link";back.href="index.html";back.textContent="← All candidates";root.append(back);
      if(!person){const box=document.createElement("section");box.className="error";box.append(element("h1","","Candidate not found"),element("p","","We couldn’t find a candidate with that student ID. Return to the directory and search by ID or name."));root.append(box);return;}
      const profile=document.createElement("section");profile.className="profile";
      const image=document.createElement("img");image.className="portrait";image.src=person.photo||"";image.alt=`${person.name} portrait`;image.onerror=()=>{image.hidden=true;};
      const copy=document.createElement("div");copy.append(element("p","eyebrow","KUAA Election 2026 · Candidate profile"),element("h1","name",person.name),element("p","position",person.position));
      const meta=document.createElement("div");meta.className="meta";meta.append(element("span","pill",`Student ID ${person.studentId}`),element("span","pill",`Batch ${person.batch}`),element("span","pill",person.discipline));if(person.previouslyElected)meta.append(element("span","pill previous-election-pill",person.previouslyElected===true?"Previously elected":`Elected ${person.previouslyElected}`));copy.append(meta);profile.append(image,copy);root.append(profile);
      const section=document.createElement("section");section.className="manifesto";
      if(person.manifesto){
        const manifesto=person.manifesto;
        const head=document.createElement("header");head.className="manifesto-head";
        const language=manifesto.language||"bn";
        const title=element("h2","manifesto-title",manifesto.title);title.lang=language;
        const countLabel=language==="bn"?`${manifesto.proposals.length.toLocaleString("bn-BD")}টি প্রস্তাব`:`${manifesto.proposals.length} proposal${manifesto.proposals.length===1?"":"s"}`;
        const count=element("span","proposal-count",countLabel);count.lang=language;head.append(title,count);section.append(head);
        const copy=document.createElement("div");copy.className="manifesto-copy";copy.lang=language;
        if(manifesto.greeting)copy.append(element("p","manifesto-greeting",manifesto.greeting));
        if(manifesto.candidateIntro)copy.append(element("p","manifesto-candidate-intro",manifesto.candidateIntro));
        for(const paragraph of manifesto.introduction||[])copy.append(element("p","",paragraph));
        if(copy.childElementCount)section.append(copy);
        const list=document.createElement("ol");list.className="proposal-list";list.lang=language;
        for(const [index,proposal] of manifesto.proposals.entries()){const item=document.createElement("li");const number=element("span","proposal-number",(index+1).toLocaleString("bn-BD",{minimumIntegerDigits:2,useGrouping:false}));number.setAttribute("aria-hidden","true");item.append(number,element("p","",proposal));list.append(item);}
        section.append(list);
      }else{section.append(element("div","notice","No manifesto has been published for this candidate yet."));}
      root.append(section);
    }
    (async()=>{let people=fallback;try{if(location.protocol!=="file:"){const response=await fetch("candidates.json",{cache:"no-store"});if(response.ok)people=await response.json();}}catch{}render(people.find(person=>person.studentId===id));})();
  </script>
</body>
</html>
